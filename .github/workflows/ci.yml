name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The app's floor is macOS 15 (Package.swift, App/Info.plist). Building
    # needs Swift 6.2, i.e. Xcode 26, which the macos-15 image carries as a
    # non-default install (Xcode_26.x.app) that the select step below picks.
    # macos-15 is used rather than macos-26 because hosted macOS 26 runners
    # are in short supply: jobs sat 15 minutes in the queue and were cancelled
    # unassigned. The floor OS is also the better place to run the harnesses.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Swift 6.2 or newer comes with Xcode 26. The image carries it as a
      # non-default install; the job fails if it is not there, the same as
      # release.yml, so a green build always means Swift 6.2.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$XCODE" ]]; then
            echo "::error::no Xcode_26*.app on this runner image; the build needs Swift 6.2"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version | grep -E '^Xcode 26([.]|$)'

      - name: Swift version
        run: swift --version

      # Package.resolved is committed, so a build gets exactly the dependency
      # versions it names; the cache follows it.
      - name: Cache .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      # swift-testing suite. Xcode is selected above, so plain `swift test`
      # finds the Testing module. Needs no models, no microphone, no TCC.
      - name: Tests (swift test)
        run: swift test

      # Text-cleanup self-check. Needs no models, no microphone, no TCC.
      - name: Self-check (--cleanup-test)
        run: swift run minnas --cleanup-test

      # Delivery backoff and pruning rules. Also no models, no TCC.
      - name: Self-check (--self-test)
        run: swift run minnas --self-test

      # One file per bash -n: with several arguments bash parses only the
      # first and treats the rest as that script's arguments.
      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      # The installer and uninstaller print their steps and change nothing.
      - name: Script dry runs
        run: |
          bash scripts/install.sh --dry-run --no-identity --no-launch
          bash scripts/uninstall.sh --dry-run </dev/null
